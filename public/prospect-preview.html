<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Pré-visualização da proposta</title><link rel="stylesheet" href="/css/styles.css"><style>body{margin:0;background:#f5f3ef;font-family:Arial,sans-serif;color:#111}.wrap{max-width:820px;margin:0 auto;padding:32px 20px 64px}.preview{background:#111;color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:16px;font-size:13px}.brand img{display:block;max-width:320px;width:100%;height:auto;margin:0 0 28px}.card{background:#fff;border:1px solid #ebe8e1;border-radius:18px;padding:38px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#8d8982;margin-bottom:8px}h1{font-size:34px;line-height:1.1;margin:0 0 8px}.intro{font-size:15px;line-height:1.65;color:#5f5c57}.offer{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:22px 0}.box{background:#faf9f6;border-radius:14px;padding:20px}.box h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#77726b;margin:0 0 12px}.plan-name{font-size:22px;font-weight:700;margin-bottom:5px}.price{font-size:34px;font-weight:700}.price small{font-size:15px;font-weight:500;color:#666}.saving{background:#fff7cf;border:1px solid #f2d75c}.saving strong{display:block;font-size:25px}.section{margin-top:28px}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.item{display:flex;gap:10px;font-size:14px}.tick{width:20px;height:20px;border-radius:50%;background:#ffd60a;display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;font-size:12px;font-weight:700}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:32px;padding-top:24px;border-top:1px solid #ece9e2}.fake{pointer-events:none;opacity:.75}@media(max-width:680px){.card{padding:26px 20px}.offer,.items{grid-template-columns:1fr}h1{font-size:28px}}</style></head><body><div class="wrap"><div class="preview">Pré-visualização interna — não conta como visualização e os botões estão desativados.</div><div class="brand"><img src="/logo-proposta.png" alt="Want it done? We DUIT"></div><div class="card" id="root">A carregar proposta…</div></div><script>const token=new URLSearchParams(location.search).get('token'),root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const PLANS={base:{label:'Base',items:['2 publicações por semana','Design gráfico + copy incluído','Planeamento mensal de conteúdos','Agendamento e publicação','Adaptação para Instagram e Facebook','Consultoria básica de perfil','Relatório mensal simples']},intermedio:{label:'Intermédio',items:['3 publicações por semana','Até 6 stories por semana','Planeamento e gestão de destaques','Design + copy adaptado ao negócio','Agendamento e publicação','Análise mensal com sugestões']},premium:{label:'Premium',items:['4 a 5 publicações por semana','Stories de segunda a sexta — até 15 por semana','Edição simples de reels','Criação de campanhas e promoções','Gestão de mensagens e comentários (a definir)','Análises quinzenais com insights']},personalizado:{label:'Proposta personalizada',items:['Serviço adaptado às necessidades do negócio']}};const fmt=v=>Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:2})+' €';async function load(){if(!token){root.innerHTML='<h1>Ligação inválida</h1>';return}try{const r=await fetch('/api/public/prospect-outreach/'+encodeURIComponent(token)),p=await r.json();if(!r.ok)throw new Error(p.error||'Não foi possível abrir.');const plan=PLANS[p.recommended_plan]||PLANS.personalizado,items=plan.items.map(i=>'<div class="item"><span class="tick">✓</span><span>'+esc(i)+'</span></div>').join('');root.innerHTML='<div class="ey">Proposta preparada para '+esc(p.company||p.name||'a sua empresa')+'</div><h1>Veja o que preparámos para si.</h1><p class="intro">Criámos uma proposta simples para manter a comunicação da sua marca ativa, consistente e profissional.</p><div class="offer"><div class="box"><h2>Solução recomendada</h2><div class="plan-name">'+esc(plan.label)+'</div><div class="price">'+fmt(p.monthly_value)+' <small>/ mês</small></div></div><div class="box saving"><h2>Oferta inicial</h2><strong>15 dias por nossa conta</strong><p>'+(p.offer_value?'Poupança inicial de '+fmt(p.offer_value)+'.':'Comece sem pagar os primeiros 15 dias de serviço.')+'</p></div></div><div class="section"><h2>O que está incluído</h2><div class="items">'+items+'</div></div><div class="actions"><button class="btn btn-ghost fake">Não avançar</button><button class="btn btn-yellow fake">Quero avançar</button></div>'}catch(e){root.innerHTML='<h1>Erro</h1><p class="intro">'+esc(e.message)+'</p>'}}load();</script></body></html>
