<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f4ef;--card:#fff;--text:#111;--accent:#ffd200;--btn:#111;--btnText:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:280px 1fr;gap:42px}
    .profile{position:sticky;top:24px;height:max-content;text-align:center}
    .logo{width:132px;height:132px;object-fit:contain;border-radius:24px;background:transparent;margin:0 auto 18px;display:block}
    h1{font-family:Antonio,sans-serif;font-size:38px;line-height:1;margin:0 0 10px}
    .desc{font-size:14px;line-height:1.55;opacity:.72;white-space:pre-wrap}
    .socials{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .socials a{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--text);text-decoration:none;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .tabs{display:flex;gap:10px;overflow:auto;padding:2px 0 18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
    .tab{border:0;background:rgba(255,255,255,.6);padding:10px 14px;border-radius:13px;font:600 13px Inter;cursor:pointer;white-space:nowrap;color:var(--text)}
    .tab.active{background:var(--accent)}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.06);display:flex;flex-direction:column}
    .card img{width:100%;height:auto;object-fit:contain;display:block;background:var(--card)}
    .body{padding:20px}.body h2{font-family:Antonio,sans-serif;font-size:27px;margin:0 0 8px;line-height:1.05}.body p{font-size:14px;line-height:1.5;opacity:.7;margin:0 0 18px;white-space:pre-wrap}
    .body a{display:inline-block;background:var(--btn);color:var(--btnText);text-decoration:none;font-weight:700;font-size:13px;padding:12px 16px;border-radius:11px}
    .empty{padding:50px 0;text-align:center;opacity:.55}
    @media(max-width:760px){
      .wrap{display:block;padding:24px 16px}.profile{position:static;margin-bottom:26px}.logo{width:104px;height:104px}.cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding-bottom:8px}.card{min-width:86%;scroll-snap-align:start}.card img{height:auto}.tabs{padding-bottom:14px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <aside class="profile">
      <img id="bio-logo" class="logo" alt="">
      <h1 id="bio-name"></h1>
      <div id="bio-desc" class="desc"></div>
      <div id="bio-socials" class="socials"></div>
    </aside>
    <section>
      <div id="bio-tabs" class="tabs"></div>
      <div id="bio-cards" class="cards"></div>
    </section>
  </main>
  <script src="/js/bio-public.js?v=20261111b"></script>
</body>
</html>
