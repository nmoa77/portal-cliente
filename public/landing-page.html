s{grid-template-columns:1fr 1fr}.bottom{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><img src="/logo-branco.png" alt="DUIT"><span>DUIT START</span></div><main class="hero" id="root">A carregar…</main><footer class="legal"><div class="legal-links"><a href="/termos-condicoes.html">Termos & Condições</a><a href="/politica-privacidade.html">Política de Privacidade</a><a href="/politica-cookies.html">Política de Cookies</a><a href="https://www.livroreclamacoes.pt/Pedido/Reclamacao" target="_blank" rel="noopener">Livro de Reclamações</a><a href="mailto:info@duit.pt">Contacto</a></div><div class="legal-id">DUIT · NIF 209 109 017 · Odivelas, Portugal</div></footer></div><div class="cookiebar" id="cookiebar"><p>Utilizamos cookies essenciais para o funcionamento do site. Cookies não essenciais só serão utilizados com o seu consentimento. <a href="/politica-cookies.html">Saber mais</a>.</p><div class="cookie-actions"><button type="button" onclick="cookieChoice('essential')">Só essenciais</button><button type="button" class="accept" onclick="cookieChoice('all')">Aceitar</button></div></div><script>const slug=location.pathname.split('/').filter(Boolean).pop(),q=new URLSearchParams(location.search),sid=sessionStorage.lpSid||(sessionStorage.lpSid=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())),utm={utm_source:q.get('utm_source')||'',utm_medium:q.get('utm_medium')||'',utm_campaign:q.get('utm_campaign')||''},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function ev(event){fetch('/api/public/lp/'+encodeURIComponent(slug)+'/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,session_id:sid,referrer:document.referrer,...utm})}).catch(()=>{})}async function load(){const r=await fetch('/api/public/lp/'+encodeURIComponent(slug)),p=await r.json();if(!r.ok){root.innerHTML='<h1>Landing page indisponível</h1>';return}document.title=p.title+' — DUIT';root.innerHTML='<div class="ey">'+esc(p.eyebrow)+'</div><h1>'+esc(p.headline)+'</h1><p>'+esc(p.intro)+'</p><section class="offer"><div class="ey">Experimente primeiro</div><h2>Veja como a DUIT pode trabalhar a sua comunicação.</h2><p>Uma experiência simples, sem fidelização, criada a partir do seu negócio e dos seus objetivos.</p><div class="features"><div class="feature"><div class="ico">▦</div><b>3 conteúdos completos</b><small>Três peças pensadas para mostrar como a sua marca pode comunicar.</small></div><div class="feature"><div class="ico">✎</div><b>Design + texto</b><small>Visual e mensagem trabalhados em conjunto.</small></div><div class="feature"><div class="ico">⌂</div><b>Feito para a sua empresa</b><small>Nada de modelos genéricos.</small></div><div class="feature"><div class="ico">↻</div><b>Sem fidelização</b><small>Experimente primeiro. Depois decide.</small></div></div><div class="bottom"><div class="price">'+(p.price_cents/100).toLocaleString('pt-PT',{style:'currency',currency:'EUR'})+'<small>PAGAMENTO ÚNICO</small></div><button class="btn" onclick="openForm()">Quero experimentar →</button></div><div class="credit">Se depois avançar para um plano mensal, recebe '+(p.credit_cents/100).toLocaleString('pt-PT',{style:'currency',currency:'EUR'})+' de crédito na primeira mensalidade.</div><form class="form" id="leadForm"><h3>Comece por aqui.</h3><div class="grid"><input name="name" placeholder="Nome *" required><input name="company" placeholder="Empresa"><input name="email" type="email" placeholder="Email *" required><input name="phone" placeholder="Telefone"></div><div class="privacy-note">Ao continuar, declara ter lido os <a href="/termos-condicoes.html" target="_blank">Termos & Condições</a> e a <a href="/politica-privacidade.html" target="_blank">Política de Privacidade</a>.</div><button class="btn">Enviar pedido →</button></form><div id="done"></div></section>';ev('view');document.getElementById('leadForm').onsubmit=submit}function openForm(){ev('cta');leadForm.classList.add('show');leadForm.scrollIntoView({behavior:'smooth',block:'center'})}async function submit(e){e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),r=await fetch('/api/public/lp/'+encodeURIComponent(slug)+'/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,...utm,session_id:sid})}),d=await r.json();if(!r.ok)return alert(d.error||'Não foi possível enviar.');location.href=d.continue_url}function cookieChoice(v){localStorage.setItem('duitCookieConsent',v);cookiebar.classList.remove('show')}if(!localStorage.getItem('duitCookieConsent'))cookiebar.classList.add('show');load();</script></body></html>
