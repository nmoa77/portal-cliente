<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT Start</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#0a0a0a;font-family:'Space Grotesk',sans-serif}.wrap{max-width:920px;margin:auto;padding:36px 20px 70px}.brand{font-size:27px;font-weight:700;margin-bottom:30px}.dot{display:inline-block;width:11px;height:11px;background:#ffd60a;margin-left:5px}.head{text-align:center;margin-bottom:28px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#777}.head h1{font-size:34px;margin:7px 0}.head p{color:#68645e;line-height:1.55}.preview{background:#fff;border:1px solid #e8e4dc;border-radius:18px;padding:14px;margin:18px 0 28px;box-shadow:0 3px 14px #00000008}.preview img{display:block;width:100%;height:auto;border-radius:12px}.texts{background:#fff;border:1px solid #e8e4dc;border-radius:18px;padding:10px 28px}.text{padding:22px 0;border-bottom:1px solid #ece8e0}.text:last-child{border-bottom:0}.text h2{font-size:16px;margin:0 0 10px}.text p{white-space:pre-wrap;line-height:1.65;font-size:14px;margin:0;color:#302e2b}.continue{background:#0a0a0a;color:#fff;border-radius:18px;padding:34px;text-align:center;margin-top:30px}.continue h2{font-size:27px;margin:0 0 8px}.continue p{color:#ccc;line-height:1.55}.discount{background:#272727;border-radius:10px;padding:12px;margin:18px auto;max-width:440px;color:#ffd60a;font-weight:600}.btn{display:inline-block;background:#ffd60a;color:#0a0a0a;text-decoration:none;border:0;border-radius:9px;padding:13px 20px;font-weight:700}.loading{text-align:center;color:#777;padding:80px 0}@media(max-width:600px){.wrap{padding:24px 14px 50px}.head h1{font-size:28px}.texts{padding:6px 20px}.continue{padding:26px 20px}}</style></head><body><main class="wrap"><div class="brand">DUIT<span class="dot"></span></div><div id="root" class="loading">A carregar os seus conteúdos…</div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),isProspect=q.get('prospect')==='1',root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{if(!token){root.textContent='Ligação inválida.';return}try{const endpoint=isProspect?'/api/public/prospect-duit-start/':'/api/public/duit-start/',r=await fetch(endpoint+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw new Error(d.error||'Não disponível');if(d.status!=='ready'){root.innerHTML='<div class="head"><div class="ey">DUIT Start</div><h1>Estamos a criar.</h1><p>Os seus 3 conteúdos ainda estão em produção.</p></div>';return}root.className='';const back=isProspect?'/prospect-response.html?token=':'/quote.html?token=',texts=(d.contents||[]).slice(0,3);root.innerHTML=`<section class="head"><div class="ey">DUIT Start · ${esc(d.client_company||d.client_name)}</div><h1>Veja como pode ficar a sua comunicação.</h1><p>Preparámos três conteúdos e apresentamo-los em conjunto para conseguir visualizar melhor a presença da sua marca nas redes sociais.</p></section><section class="preview">${d.preview_image_url?`<img src="${esc(d.preview_image_url)}" alt="Apresentação visual dos três conteúdos">`:'<div style="padding:60px;text-align:center;color:#777">Apresentação visual</div>'}</section><section class="texts">${texts.map((c,i)=>`<article class="text"><h2>Conteúdo ${i+1}</h2><p>${esc(c.post_text||'')}</p></article>`).join('')}</section><section class="continue"><div class="ey" style="color:#999">Gostou do resultado?</div><h2>Isto foi apenas o início.</h2><p>Podemos continuar a planear, criar e acompanhar a sua comunicação todos os meses.</p><div class="discount">Os seus 30 € serão descontados na primeira mensalidade.</div><a class="btn" href="${back}${encodeURIComponent(token)}">Ver planos mensais</a></section>`}catch(e){root.textContent=e.message}})();</script></body></html>
