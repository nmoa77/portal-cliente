<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT Start</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#0a0a0a;font-family:'Space Grotesk',sans-serif}.wrap{max-width:760px;margin:auto;padding:36px 20px 70px}.brand{font-size:27px;font-weight:700;margin-bottom:30px}.dot{display:inline-block;width:11px;height:11px;background:#ffd60a;margin-left:5px}.head{text-align:center;margin-bottom:28px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#777}.head h1{font-size:34px;margin:7px 0}.head p{color:#68645e}.content{background:#fff;border:1px solid #e8e4dc;border-radius:18px;overflow:hidden;margin:18px 0;box-shadow:0 2px 10px #00000008}.visual{aspect-ratio:4/3;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.copy{padding:22px 24px}.copy h2{font-size:18px;margin:0 0 10px}.copy p{white-space:pre-wrap;line-height:1.6;font-size:14px;margin:0}.continue{background:#0a0a0a;color:#fff;border-radius:18px;padding:34px;text-align:center;margin-top:30px}.continue h2{font-size:27px;margin:0 0 8px}.continue p{color:#ccc;line-height:1.55}.discount{background:#272727;border-radius:10px;padding:12px;margin:18px auto;max-width:440px;color:#ffd60a;font-weight:600}.btn{display:inline-block;background:#ffd60a;color:#0a0a0a;text-decoration:none;border:0;border-radius:9px;padding:13px 20px;font-weight:700;cursor:pointer}.loading{text-align:center;color:#777;padding:80px 0}</style></head><body><main class="wrap"><div class="brand">DUIT<span class="dot"></span></div><div id="root" class="loading">A carregar os seus conteúdos…</div></main><script>const token=new URLSearchParams(location.search).get('token'),root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{if(!token){root.textContent='Ligação inválida.';return}try{const r=await fetch('/api/public/duit-start/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Não disponível');if(d.status!=='ready'){root.innerHTML='<div class="head"><div class="ey">DUIT Start</div><h1>Estamos a criar.</h1><p>Os seus 3 conteúdos ainda estão em produção. Volte a esta página quando receber a confirmação da DUIT.</p></div>';return}root.className='';root.innerHTML=`<section class="head"><div class="ey">DUIT Start · ${esc(d.client_company||d.client_name)}</div><h1>Os seus 3 conteúdos estão prontos.</h1><p>Esta é uma amostra da forma como a DUIT pode trabalhar a sua comunicação.</p></section>${d.contents.map((c,i)=>`<article class="content"><div class="visual">${c.image_url?`<img src="${esc(c.image_url)}" alt="Conteúdo ${i+1}">`:'<span>Imagem do conteúdo</span>'}</div><div class="copy"><h2>Conteúdo ${i+1}</h2><p>${esc(c.post_text||'')}</p></div></article>`).join('')}<section class="continue"><div class="ey" style="color:#999">Gostou do resultado?</div><h2>Isto foi apenas o início.</h2><p>Podemos continuar a planear, criar e acompanhar a sua comunicação todos os meses.</p><div class="discount">Os seus 30 € serão descontados na primeira mensalidade.</div><a class="btn" href="/quote.html?token=${encodeURIComponent(token)}">Ver planos mensais</a></section>`}catch(e){root.textContent=e.message}})();</script></body></html>
