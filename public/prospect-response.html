<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Proposta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"><style>
body{margin:0;background:#f5f3ef;font-family:'Space Grotesk',Arial,sans-serif;color:#111}.wrap{max-width:1120px;margin:0 auto;padding:42px 20px 64px}.brand{margin:0 0 28px}.brand img{display:block;max-width:320px;width:100%;height:auto}.card{background:#fff;border:1px solid #ebe8e1;border-radius:18px;padding:38px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#8d8982;margin-bottom:8px}h1{font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.03em}.intro{font-size:15px;line-height:1.65;color:#5f5c57;margin:0 0 28px;max-width:720px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.plan{position:relative;border:1px solid #e7e3dc;border-radius:16px;padding:23px;display:flex;flex-direction:column;background:#fff}.plan.recommended{border:2px solid #111;padding:22px}.badge{position:absolute;right:14px;top:14px;background:#111;color:#fff;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.plan-name{font-size:22px;font-weight:700;margin-bottom:7px}.price{font-size:32px;font-weight:700;line-height:1;margin-bottom:18px}.price small{font-size:14px;font-weight:500;color:#666}.bonus{background:#ffd60a;border-radius:10px;padding:13px 14px;margin-bottom:18px}.bonus strong{font-size:20px;display:block}.bonus span{font-size:12px;display:block;margin-top:2px}.items{display:grid;gap:9px;margin-bottom:22px}.item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4}.tick{font-weight:700}.choose{margin-top:auto;width:100%;justify-content:center}.section{margin-top:30px}.section h2{font-size:18px;margin:0 0 13px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{border:1px solid #ece9e2;border-radius:12px;padding:15px}.step b{display:block;font-size:13px;margin-bottom:5px}.step span{font-size:12px;color:#716d66;line-height:1.45}.ebook{margin-top:28px;padding:22px;border-radius:14px;background:#111;color:#fff}.ebook h2{margin:0 0 7px;font-size:20px}.ebook p{margin:0 0 15px;color:#d6d6d6;font-size:14px}.ebook a{display:inline-block;background:#ffd60a;color:#111;text-decoration:none;font-weight:700;padding:11px 17px;border-radius:8px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap;padding-top:22px;border-top:1px solid #ece9e2}.reason{display:none;margin-top:20px;padding:18px;background:#faf9f6;border-radius:12px}.reason.show{display:block}.reason textarea{width:100%;min-height:96px;box-sizing:border-box;padding:12px;border:1px solid #ddd8ce;border-radius:10px;font:inherit}.done{padding:18px;border-radius:12px;margin-top:20px;background:#f7f7f4;line-height:1.55}.preview-note{background:#eaf5ff;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}.foot{text-align:center;font-size:13px;margin-top:24px}.foot a{color:#8d8982;text-decoration:none}.foot strong{color:#111}@media(max-width:850px){.plans{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}@media(max-width:680px){.card{padding:26px 20px}.brand img{max-width:260px}h1{font-size:28px}}
</style></head><body><div class="wrap"><div class="brand"><img src="/logo-proposta.png" alt="Want it done? We DUIT"></div><div class="card" id="root">A carregar proposta…</div><div class="foot"><a href="https://www.duit.pt/" target="_blank" rel="noopener">Want it Done? <strong>We DUIT.</strong></a></div></div><script>
const qs=new URLSearchParams(location.search),token=qs.get('token'),preview=qs.get('preview')==='1',root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLANS={base:{label:'Base',price:150,offer:75,items:['2 publicações por semana','Design gráfico + copy incluído','Planeamento mensal de conteúdos','Agendamento e publicação','Adaptação para Instagram e Facebook','Consultoria básica de perfil','Relatório mensal simples']},intermedio:{label:'Intermédio',price:200,offer:100,items:['3 publicações por semana','Até 6 stories por semana','Planeamento e gestão de destaques','Design + copy adaptado ao negócio','Agendamento e publicação','Análise mensal com sugestões']},premium:{label:'Premium',price:280,offer:140,items:['4 a 5 publicações por semana','Stories de segunda a sexta — até 15 por semana','Edição simples de reels','Criação de campanhas e promoções','Gestão de mensagens e comentários (a definir)','Análises quinzenais com insights']}};
const fmt=v=>Number(v||0).toLocaleString('pt-PT',{maximumFractionDigits:0})+' €';
function planCard(key,p){const x=PLANS[key],rec=p.recommended_plan===key;return `<div class="plan ${rec?'recommended':''}">${rec?'<span class="badge">Recomendado</span>':''}<div class="plan-name">${x.label}</div><div class="price">${fmt(x.price)} <small>/ mês</small></div><div class="bonus"><strong>OFERTA ${fmt(x.offer)}</strong><span>Na adesão por 2 meses.</span></div><div class="items">${x.items.map(i=>`<div class="item"><span class="tick">✓</span><span>${esc(i)}</span></div>`).join('')}</div><button class="btn ${rec?'btn-yellow':'btn-primary'} choose" ${preview?'disabled title="Pré-visualização"':`onclick="choosePlan('${key}')"`}>Escolher este plano</button></div>`}
async function load(){if(!token){root.innerHTML='<h1>Ligação inválida</h1>';return}try{const r=await fetch('/api/public/prospect-outreach/'+encodeURIComponent(token)),p=await r.json();if(!r.ok){root.innerHTML='<h1>Ligação inválida</h1><p class="intro">'+esc(p.error||'Não foi possível abrir esta proposta.')+'</p>';return}if(p.outreach_response&&!preview){const chosen=PLANS[p.selected_plan];root.innerHTML='<div class="ey">Proposta DUIT</div><h1>Obrigado pela resposta.</h1><div class="done">'+(p.outreach_response==='accepted'?`✓ Escolheu o plano ${esc(chosen?.label||'selecionado')}. A DUIT entrará em contacto consigo para tratar dos próximos passos.`:'A sua resposta ficou registada. Obrigado pelo seu tempo.')+'</div>';return}root.innerHTML=`${preview?'<div class="preview-note">Pré-visualização — nenhuma ação nesta página fica registada.</div>':''}<div class="ey">Proposta preparada para ${esc(p.company||p.name||'a sua empresa')}</div><h1>Escolha a solução que melhor se adapta ao seu negócio.</h1><p class="intro">Compare as opções e escolha o nível de acompanhamento que faz mais sentido para a sua marca. Destacámos a solução que recomendamos, mas a decisão é sua.</p><div class="plans">${['base','intermedio','premium'].map(k=>planCard(k,p)).join('')}</div><div class="ebook"><h2>E ainda recebe um ebook DUIT</h2><p>${p.ebook_title?esc(p.ebook_title):'Uma leitura rápida e gratuita preparada pela DUIT.'}</p>${preview?'<span style="color:#aaa;font-size:13px">Link desativado na pré-visualização.</span>':`<a href="/api/public/prospect-guide/${encodeURIComponent(token)}">Descarregar ebook</a>`}</div><div class="section"><h2>Como funciona</h2><div class="steps"><div class="step"><b>1. Escolha o seu plano</b><span>Selecione diretamente a opção que melhor se adapta ao seu negócio.</span></div><div class="step"><b>2. Tratamos do arranque</b><span>Entramos em contacto para recolher o essencial e organizar o início.</span></div><div class="step"><b>3. A DUIT trata das redes</b><span>Planeamos, criamos e publicamos para manter a comunicação ativa.</span></div></div></div>${preview?'':`<div class="actions"><button class="btn btn-ghost" onclick="showReject()">Não avançar</button></div><div class="reason" id="reason"><label>Motivo (opcional)</label><textarea id="reasonText" placeholder="Se quiser, diga-nos brevemente porque não pretende avançar neste momento."></textarea><div class="actions"><button class="btn btn-ghost" onclick="document.getElementById('reason').classList.remove('show')">Voltar</button><button class="btn btn-primary" onclick="respond('rejected')">Enviar resposta</button></div></div>`}`;}catch(e){root.innerHTML='<h1>Erro de ligação</h1><p class="intro">Não foi possível carregar a proposta.</p>'}}
function showReject(){document.getElementById('reason')?.classList.add('show')}
function choosePlan(plan){const p=PLANS[plan];if(!p||!confirm(`Confirma que pretende avançar com o plano ${p.label} por ${fmt(p.price)}/mês?`))return;respond('accepted',plan)}
async function respond(status,plan=''){if(preview)return;const reason=document.getElementById('reasonText')?.value||'',r=await fetch('/api/public/prospect-outreach/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason,plan})});if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.error||'Não foi possível registar a resposta.');return}load()}
load();
</script></body></html>
