<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Responder à proposta</title><link rel="stylesheet" href="/css/styles.css"><style>body{background:#f5f3ef;font-family:'Space Grotesk',Arial,sans-serif}.wrap{max-width:650px;margin:0 auto;padding:45px 20px}.brand{font-size:30px;font-weight:900;margin-bottom:25px}.brand b{color:#ffd60a}.card{background:#fff;border-radius:16px;padding:34px;box-shadow:0 1px 4px #0000000d}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#888}.card h1{font-size:28px;margin:8px 0 12px}.meta{color:#666;line-height:1.6}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap}.reason{display:none;margin-top:22px}.reason.show{display:block}.reason textarea{width:100%;min-height:90px;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.done{padding:18px;border-radius:10px;margin-top:20px;background:#f7f7f4}.foot{text-align:center;color:#888;font-size:12px;margin-top:24px}</style></head><body><div class="wrap"><div class="brand">DUIT<b>.</b></div><div class="card" id="root">A carregar…</div><div class="foot">DUIT · Want it done?</div></div><script>const token=new URLSearchParams(location.search).get('token'),root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!token)return root.innerHTML='<h1>Ligação inválida</h1>';const r=await fetch('/api/public/prospect-outreach/'+encodeURIComponent(token));const p=await r.json();if(!r.ok)return root.innerHTML='<h1>Ligação inválida</h1><p>'+esc(p.error||'Não foi possível abrir esta proposta.')+'</p>';if(p.outreach_response)return root.innerHTML='<div class="ey">Proposta DUIT</div><h1>Obrigado pela resposta.</h1><div class="done">'+(p.outreach_response==='accepted'?'✓ Indicou que pretende avançar. Entraremos em contacto consigo.':'Resposta registada. Obrigado pelo seu tempo.')+'</div>';root.innerHTML='<div class="ey">Proposta DUIT</div><h1>'+esc(p.company||p.name||'')+'</h1><div class="meta">'+(p.recommended_plan?'<strong>'+esc(p.recommended_plan)+'</strong><br>':'')+(p.monthly_value?esc(p.monthly_value)+' €/mês':'')+(p.offer_value?' · oferta inicial '+esc(p.offer_value)+' €':'')+'</div><div class="actions"><button class="btn btn-ghost" onclick="showReject()">Não avançar</button><button class="btn btn-yellow" onclick="respond(\'accepted\')">Quero avançar</button></div><div class="reason" id="reason"><label>Motivo <span style="color:#888">(opcional)</span></label><textarea id="reasonText" placeholder="Se quiser, diga-nos brevemente o motivo."></textarea><div class="actions"><button class="btn btn-ghost" onclick="document.getElementById(\'reason\').classList.remove(\'show\')">Voltar</button><button class="btn btn-primary" onclick="respond(\'rejected\')">Enviar resposta</button></div></div>'}function showReject(){document.getElementById('reason').classList.add('show')}async function respond(status){if(status==='accepted'&&!confirm('Confirma que pretende avançar?'))return;const reason=document.getElementById('reasonText')?.value||'';const r=await fetch('/api/public/prospect-outreach/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});if(!r.ok){const e=await r.json().catch(()=>({}));return alert(e.error||'Não foi possível registar a resposta.')}load()}load();</script></body></html>
