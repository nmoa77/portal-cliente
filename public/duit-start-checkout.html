<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Adesão mensal</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#111;font-family:'Space Grotesk',sans-serif}.wrap{max-width:720px;margin:auto;padding:38px 20px 70px}.logo{width:145px;height:auto}.card{margin-top:55px;background:#fff;border:1px solid #e7e3dc;border-radius:18px;padding:32px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#888}.card h1{font-size:32px;margin:8px 0 10px}.intro{color:#69645e;line-height:1.6}.summary{background:#111;color:#fff;border-radius:14px;padding:20px 22px;margin:25px 0}.row{display:flex;justify-content:space-between;gap:20px;padding:7px 0}.credit{color:#ffd60a}.total{border-top:1px solid #444;margin-top:8px;padding-top:15px;font-size:20px;font-weight:700}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.method{border:1px solid #ddd8cf;background:#fff;border-radius:11px;padding:14px;cursor:pointer;font:inherit;font-weight:600}.method.on{border:2px solid #111}.mobile{display:none;margin:0 0 18px}.mobile input{width:100%;padding:13px;border:1px solid #ddd8cf;border-radius:9px;font:inherit}.paybox{background:#f7f6f2;border-radius:12px;padding:18px;margin-top:20px}.btn{display:block;width:100%;border:0;border-radius:10px;background:#ffd60a;color:#111;padding:15px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.back{display:block;text-align:center;color:#777;margin-top:16px;font-size:13px;text-decoration:none}.note{font-size:12px;color:#888;line-height:1.5;margin-top:18px}@media(max-width:600px){.card{padding:24px}.card h1{font-size:27px}}</style></head><body><main class="wrap"><img class="logo" src="/logo-proposta.png" alt="DUIT"><div id="root"><div class="card">A carregar…</div></div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),prospect=q.get('prospect')==='1',key=q.get('plan'),root=document.getElementById('root'),PLANS={base:{name:'Base',price:150},intermedio:{name:'Intermédio',price:200},premium:{name:'Premium',price:280}},money=v=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';(async()=>{const p=PLANS[key];if(!token||!p){root.innerHTML='<div class="card">Ligação inválida.</div>';return}try{const ep=prospect?'/api/public/prospect-duit-start/':'/api/public/duit-start/',r=await fetch(ep+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw new Error(d.error||'Ligação inválida.');const credit=Number(d.price||19.99),first=Math.max(0,p.price-credit);root.innerHTML='<section class="card"><div class="ey">Continuar com a DUIT</div><h1>Plano '+p.name+'</h1><p class="intro">Confirme o plano escolhido. O valor pago no DUIT Start é descontado integralmente na primeira mensalidade.</p><div class="summary"><div class="row"><span>Plano '+p.name+'</span><strong>'+money(p.price)+'/mês</strong></div><div class="row credit"><span>Crédito DUIT Start</span><strong>− '+money(credit)+'</strong></div><div class="row total"><span>Primeira mensalidade</span><span>'+money(first)+'</span></div></div><div class="methods"><button class="method on" id="mb" type="button" onclick="pick('multibanco')">Multibanco</button><button class="method" id="mw" type="button" onclick="pick('mbway')">MB WAY</button></div><div class="mobile" id="mobile"><input id="phone" inputmode="tel" placeholder="Número de telemóvel MB WAY"></div><button class="btn" id="pay" type="button" onclick="pay()">Continuar para pagamento</button><div id="result"></div><a class="back" id="backPlans" href="#">← Voltar aos planos</a><p class="note">A partir da segunda mensalidade aplica-se o valor normal do plano escolhido.</p></section>';document.getElementById('backPlans').href='/duit-start-planos.html?token='+encodeURIComponent(token)+'&prospect='+(prospect?'1':'0');}catch(e){root.innerHTML='<div class="card">'+e.message+'</div>'}})();let method='multibanco';function pick(m){method=m;document.getElementById('mb').classList.toggle('on',m==='multibanco');document.getElementById('mw').classList.toggle('on',m==='mbway');document.getElementById('mobile').style.display=m==='mbway'?'block':'none'}async function pay(){const b=document.getElementById('pay'),out=document.getElementById('result');b.disabled=true;b.textContent='A processar…';try{const r=await fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/monthly-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:key,payment_method:method,mobile:document.getElementById('phone').value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível iniciar o pagamento.');if(method==='multibanco')out.innerHTML='<div class="paybox"><strong>Referência Multibanco criada</strong><div style="margin-top:12px">Entidade<br><b>'+d.entity+'</b></div><div style="margin-top:9px">Referência<br><b>'+d.reference+'</b></div><div style="margin-top:9px">Valor<br><b>'+money(d.amount)+'</b></div></div>';else out.innerHTML='<div class="paybox"><strong>Pedido MB WAY enviado.</strong><p>Confirme o pagamento na aplicação MB WAY.</p></div>';b.style.display='none'}catch(e){out.innerHTML='<p style="color:#b42318">'+e.message+'</p>';b.disabled=false;b.textContent='Continuar para pagamento'}};</script></body></html>
