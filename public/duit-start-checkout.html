<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Adesão mensal</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#111;font-family:'Space Grotesk',sans-serif}.wrap{max-width:720px;margin:auto;padding:38px 20px 70px}.logo{width:145px;height:auto}.card{margin-top:55px;background:#fff;border:1px solid #e7e3dc;border-radius:18px;padding:32px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#888}.card h1{font-size:32px;margin:8px 0 10px}.intro{color:#69645e;line-height:1.6}.summary{background:#111;color:#fff;border-radius:14px;padding:20px 22px;margin:25px 0}.row{display:flex;justify-content:space-between;gap:20px;padding:7px 0}.credit{color:#ffd60a}.total{border-top:1px solid #444;margin-top:8px;padding-top:15px;font-size:20px;font-weight:700}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.method{border:1px solid #ddd8cf;background:#fff;border-radius:11px;padding:14px;cursor:pointer;font:inherit;font-weight:600}.method.on{border:2px solid #111}.mobile{display:none;margin:0 0 18px}.mobile input{width:100%;padding:13px;border:1px solid #ddd8cf;border-radius:9px;font:inherit}.paybox{background:#f7f6f2;border-radius:12px;padding:18px;margin-top:20px}.finalmsg{margin-top:16px;background:#111;color:#fff;border-radius:12px;padding:20px;line-height:1.55}.finalmsg strong{display:block;font-size:18px;margin-bottom:5px}.finalmsg span{color:#ccc;font-size:13px}.finalstep{margin-top:20px;background:#111;color:#fff;border-radius:14px;padding:28px;text-align:center}.finalstep .check{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:#ffd60a;color:#111;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}.finalstep h2{font-size:25px;margin:0 0 8px}.finalstep p{color:#ccc;line-height:1.6;margin:0 auto 20px;max-width:520px}.finalstep .btn{max-width:320px;margin:0 auto}.statusline{margin-top:14px;font-size:12px;color:#888;text-align:center}.btn{display:block;width:100%;border:0;border-radius:10px;background:#ffd60a;color:#111;padding:15px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.back{display:block;text-align:center;color:#777;margin-top:16px;font-size:13px;text-decoration:none}.note{font-size:12px;color:#888;line-height:1.5;margin-top:18px}@media(max-width:600px){.card{padding:24px}.card h1{font-size:27px}}</style></head><body><main class="wrap"><img class="logo" src="/logo-proposta.png" alt="DUIT"><div id="root"><div class="card">A carregar…</div></div></main><script>
const q=new URLSearchParams(location.search);
const token=q.get('token');
const prospect=q.get('prospect')==='1';
const key=q.get('plan');
const root=document.getElementById('root');
const PLANS={base:{name:'Base',price:150},intermedio:{name:'Intermédio',price:200},premium:{name:'Premium',price:280}};
const money=v=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let method='multibanco';

function pick(m){
 method=m;
 document.getElementById('mb').classList.toggle('on',m==='multibanco');
 document.getElementById('mw').classList.toggle('on',m==='mbway');
 document.getElementById('mobile').style.display=m==='mbway'?'block':'none';
}
function showFinal(){
 const card=document.querySelector('.card');
 if(!card)return;
 const methods=card.querySelector('.methods'),mobile=card.querySelector('#mobile'),payBtn=card.querySelector('#pay'),result=card.querySelector('#result');
 if(methods)methods.style.display='none';
 if(mobile)mobile.style.display='none';
 if(payBtn)payBtn.style.display='none';
 if(result)result.innerHTML='<div class="finalstep"><div class="check">✓</div><div class="ey" style="color:#aaa">Adesão concluída</div><h2>Está tudo tratado.</h2><p>O pagamento foi confirmado e a sua adesão mensal ficou ativa. Enviámos por email os dados de acesso ao Portal DUIT.</p><a class="btn" href="/">Aceder ao Portal DUIT →</a></div><div class="statusline">A partir da segunda mensalidade aplica-se o valor normal do plano escolhido.</div>';
}
let paymentPoll=null;
async function checkPayment(){
 try{
  const r=await fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/monthly-payment',{cache:'no-store'});
  if(!r.ok)return;
  const d=await r.json();
  if(d.payment_status==='paid'){
   if(paymentPoll){clearInterval(paymentPoll);paymentPoll=null}
   showFinal();
  }
 }catch(_){}
}
function startPaymentWatch(){
 checkPayment();
 if(!paymentPoll)paymentPoll=setInterval(checkPayment,5000);
}
async function pay(){
 const btn=document.getElementById('pay'),out=document.getElementById('result');
 btn.disabled=true; btn.textContent='A processar…';
 try{
  const r=await fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/monthly-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:key,payment_method:method,mobile:document.getElementById('phone').value})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Não foi possível iniciar o pagamento.');
  out.innerHTML=method==='multibanco'
   ? '<div class="paybox"><strong>Referência Multibanco criada</strong><div style="margin-top:12px">Entidade<br><b>'+d.entity+'</b></div><div style="margin-top:9px">Referência<br><b>'+d.reference+'</b></div><div style="margin-top:9px">Valor<br><b>'+money(d.amount)+'</b></div></div>'
   : '<div class="paybox"><strong>Pedido MB WAY enviado.</strong><p>Confirme o pagamento na aplicação MB WAY.</p></div>';
  const thanks='/duit-start-adesao-obrigado.html?token='+encodeURIComponent(token)+'&method='+encodeURIComponent(method);
  location.href=thanks;
 }catch(e){
  out.innerHTML='<p style="color:#b42318">'+e.message+'</p>';
  btn.disabled=false; btn.textContent='Continuar para pagamento';
 }
}
async function init(){
 const p=PLANS[key];
 if(!token||!p){root.innerHTML='<div class="card">Ligação inválida.</div>';return;}
 try{
  const ep=prospect?'/api/public/prospect-duit-start/':'/api/public/duit-start/';
  const r=await fetch(ep+encodeURIComponent(token),{cache:'no-store'});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Ligação inválida.');
  const startPrice=Number(d.price||9.99),credit=startPrice<=10.01?10:startPrice,first=Math.max(0,p.price-credit);
  root.innerHTML=`<section class="card">
   <div class="ey">Continuar com a DUIT</div><h1>Plano ${p.name}</h1>
   <p class="intro">Confirme o plano escolhido. O DUIT Start dá-lhe 10,00 € de crédito na primeira mensalidade.</p>
   <div class="summary"><div class="row"><span>Plano ${p.name}</span><strong>${money(p.price)}/mês</strong></div>
   <div class="row credit"><span>Crédito DUIT Start</span><strong>− ${money(credit)}</strong></div>
   <div class="row total"><span>Primeira mensalidade</span><span>${money(first)}</span></div></div>
   <div class="methods"><button class="method on" id="mb" type="button" onclick="pick('multibanco')">Multibanco</button><button class="method" id="mw" type="button" onclick="pick('mbway')">MB WAY</button></div>
   <div class="mobile" id="mobile"><input id="phone" inputmode="tel" placeholder="Número de telemóvel MB WAY"></div>
   <button class="btn" id="pay" type="button" onclick="pay()">Continuar para pagamento</button><div id="result"></div>
   <p class="note">A partir da segunda mensalidade aplica-se o valor normal do plano escolhido.</p>
  </section>`;
  try{
   const mr=await fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/monthly-payment',{cache:'no-store'});
   if(mr.ok){
    const md=await mr.json();
    if(md.payment_status==='paid'||(md.payment_status==='pending'&&(md.entity||md.request_id))){
      location.href='/duit-start-adesao-obrigado.html?token='+encodeURIComponent(token)+'&method='+encodeURIComponent(md.payment_method||method);
      return;
    }
   }
  }catch(_){};
 }catch(e){root.innerHTML='<div class="card">'+e.message+'</div>';}
}
init();
</script></body></html>
