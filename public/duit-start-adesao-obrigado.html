<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Obrigado</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#111;font-family:'Space Grotesk',sans-serif}.wrap{max-width:720px;margin:auto;padding:38px 20px 70px}.logo{width:145px;height:auto}.card{margin-top:55px;background:#fff;border:1px solid #e7e3dc;border-radius:18px;padding:34px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#888}.check{width:62px;height:62px;border-radius:50%;background:#ffd60a;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin-bottom:20px}.card h1{font-size:32px;margin:8px 0 12px}.intro{color:#69645e;line-height:1.65}.paybox{background:#f7f6f2;border-radius:12px;padding:18px;margin:22px 0}.paybox b{font-size:18px}.status{background:#111;color:#fff;border-radius:14px;padding:22px;margin-top:22px;line-height:1.6}.status strong{display:block;font-size:19px;margin-bottom:6px}.status span{color:#ccc;font-size:13px}.btn{display:inline-block;background:#ffd60a;color:#111;text-decoration:none;border-radius:10px;padding:14px 18px;font-weight:700;margin-top:18px}.small{font-size:12px;color:#888;line-height:1.5;margin-top:16px}@media(max-width:600px){.card{padding:26px}.card h1{font-size:28px}}</style></head><body><main class="wrap"><img class="logo" src="/logo-proposta.png" alt="DUIT"><div class="card" id="root">A carregar…</div></main><script>
const q=new URLSearchParams(location.search),token=q.get('token'),method=q.get('method')||'',root=document.getElementById('root'),money=v=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let timer=null;
function paidView(){
 root.innerHTML='<div class="check">✓</div><div class="ey">Adesão concluída</div><h1>Está tudo tratado.</h1><p class="intro">O pagamento foi confirmado e a sua adesão mensal ficou ativa.</p><div class="status"><strong>Bem-vindo à DUIT.</strong><span>Enviámos para o seu email os dados de acesso ao Portal DUIT.</span></div><a class="btn" href="/">Aceder ao Portal DUIT →</a>';
}
function pendingView(d){
 if((d.payment_method||method)==='multibanco'){
  root.innerHTML='<div class="check">✓</div><div class="ey">Adesão registada</div><h1>Obrigado.</h1><p class="intro">A sua adesão ficou registada. Enviámos também os dados de pagamento para o seu email.</p><div class="paybox"><div>Entidade<br><b>'+d.entity+'</b></div><div style="margin-top:10px">Referência<br><b>'+d.reference+'</b></div><div style="margin-top:10px">Valor<br><b>'+money(d.amount)+'</b></div></div><div class="status"><strong>Aguardamos a confirmação do pagamento.</strong><span>Assim que for confirmado, concluímos automaticamente a adesão e enviamos os dados de acesso ao portal.</span></div><div class="small">Pode fechar esta página. Não é necessário permanecer aqui enquanto aguarda.</div>';
 }else{
  root.innerHTML='<div class="check">✓</div><div class="ey">Pedido enviado</div><h1>Obrigado.</h1><p class="intro">O pedido de pagamento foi enviado para a aplicação MB WAY.</p><div class="status"><strong>Confirme o pagamento no MB WAY.</strong><span>Assim que recebermos a confirmação, concluímos automaticamente a adesão e enviamos os dados de acesso ao portal.</span></div><div class="small">Pode fechar esta página depois de confirmar o pagamento na aplicação.</div>';
 }
}
async function load(){
 if(!token){root.textContent='Ligação inválida.';return}
 try{
  const r=await fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/monthly-payment',{cache:'no-store'}),d=await r.json();
  if(!r.ok)throw new Error(d.error||'Não foi possível consultar a adesão.');
  if(d.payment_status==='paid'){if(timer)clearInterval(timer);paidView();return}
  pendingView(d);
  if(!timer)timer=setInterval(load,5000);
 }catch(e){root.textContent=e.message}
}
load();
</script></body></html>
