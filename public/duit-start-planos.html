<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUIT — Planos mensais</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#111;font-family:'Space Grotesk',sans-serif}.wrap{max-width:1080px;margin:auto;padding:38px 20px 70px}.brand{font-size:28px;font-weight:700}.dot{display:inline-block;width:11px;height:11px;background:#ffd60a;margin-left:5px}.head{text-align:center;max-width:720px;margin:42px auto 28px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#888}.head h1{font-size:36px;margin:8px 0}.head p{color:#69645e;line-height:1.6}.credit{margin:22px auto 0;background:#111;color:#fff;border-radius:14px;padding:17px 22px;max-width:560px}.credit strong{color:#ffd60a}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.plan{background:#fff;border:1px solid #e7e3dc;border-radius:18px;padding:24px;display:flex;flex-direction:column}.name{font-size:21px;font-weight:700}.price{font-size:32px;font-weight:700;margin:8px 0 2px}.price small{font-size:12px;color:#777;font-weight:500}.first{font-size:12px;color:#666;margin-bottom:18px}.first strong{color:#111}.items{display:grid;gap:9px;margin:8px 0 22px}.item{font-size:12px;color:#68635d;padding-left:18px;position:relative;line-height:1.45}.item:before{content:'✓';position:absolute;left:0;font-weight:700;color:#111}.btn{margin-top:auto;border:0;border-radius:10px;background:#111;color:#fff;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer}.note{text-align:center;color:#8b8680;font-size:11px;margin-top:22px}@media(max-width:760px){.plans{grid-template-columns:1fr}.head h1{font-size:30px}}</style></head><body><main class="wrap"><div class="brand"><img src="/logo-proposta.png" alt="DUIT" style="display:block;width:145px;max-width:40vw;height:auto"></div><div id="root">A carregar…</div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),prospect=q.get('prospect')==='1',root=document.getElementById('root'),PLANS={base:{name:'Base',price:150,items:['2 publicações por semana','Design gráfico + copy','Planeamento mensal','Agendamento e publicação','Instagram e Facebook','Relatório mensal']},intermedio:{name:'Intermédio',price:200,items:['3 publicações por semana','Até 6 stories por semana','Gestão de destaques','Design + copy','Agendamento e publicação','Análise mensal']},premium:{name:'Premium',price:280,items:['4 a 5 publicações por semana','Até 15 stories por semana','Edição simples de reels','Campanhas e promoções','Gestão de mensagens/comentários a definir','Análises quinzenais']}};const money=v=>Number(v).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';(async()=>{if(!token)return root.textContent='Ligação inválida.';const ep=prospect?'/api/public/prospect-duit-start/':'/api/public/duit-start/';const r=await fetch(ep+encodeURIComponent(token)),d=await r.json();if(!r.ok)return root.textContent=d.error||'Ligação inválida.';const credit=Number(d.price||19.99);root.innerHTML='<section class="head"><div class="ey">Continuar com a DUIT</div><h1>Escolha o acompanhamento mensal.</h1><p>O DUIT Start terminou. Agora pode escolher o plano mensal que melhor se adapta à sua comunicação.</p><div class="credit">Crédito DUIT Start: <strong>'+money(credit)+'</strong> descontado na primeira mensalidade.</div></section><section class="plans">'+Object.entries(PLANS).map(([k,p])=>'<article class="plan"><div class="name">'+p.name+'</div><div class="price">'+money(p.price)+' <small>/ mês</small></div><div class="first">Primeira mensalidade: <strong>'+money(Math.max(0,p.price-credit))+'</strong></div><div class="items">'+p.items.map(x=>'<div class="item">'+x+'</div>').join('')+'</div><button class="btn" onclick="choose(\''+k+'\')">Escolher este plano</button></article>').join('')+'</section><div class="note">O crédito do DUIT Start não acumula com outras campanhas ou descontos.</div>'})();function choose(plan){location.href='/duit-start-checkout.html?token='+encodeURIComponent(token)+'&prospect='+(prospect?'1':'0')+'&plan='+encodeURIComponent(plan)}
if(token)fetch('/api/public/prospect-duit-start/'+encodeURIComponent(token)+'/plans-viewed',{method:'POST'}).catch(()=>{});
</script></body></html>
